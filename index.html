<style>
:root {
  --bg: #FAF5ED;
  --bg-soft: #F2EBDC;
  --card: #FFFFFF;
  --text: #2C2820;
  --text-sub: #847B6C;
  --accent: #6B8E5A;
  --accent-soft: #D4DFC9;
  --accent-dark: #4A6A3E;
  --border: #E8DFCC;
  --danger: #B05E54;
  --shadow: 0 2px 10px rgba(80, 62, 30, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: 90px;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212, 223, 201, 0.15), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(232, 223, 204, 0.3), transparent 40%);
  min-height: 100vh;
}
header {
  padding: 18px 16px 12px;
  position: sticky;
  top: 0;
  background: rgba(250, 245, 237, 0.92);
  backdrop-filter: blur(10px);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.app-title {
  font-family: 'Klee One', cursive;
  font-size: 22px;
  font-weight: 600;
  color: var(--accent-dark);
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}
.search-bar {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.2s;
}
.search-bar:focus { outline: none; border-color: var(--accent); }
.search-bar::placeholder { color: var(--text-sub); }
main {
  padding: 14px 16px;
  max-width: 640px;
  margin: 0 auto;
}
.list-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-sub);
}
.merge-toggle {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 12px;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.2s;
}
.merge-toggle.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.prompt-list { display: flex; flex-direction: column; gap: 10px; }
.prompt-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 2px solid transparent;
  box-shadow: var(--shadow);
  position: relative;
}
.prompt-card:active { transform: scale(0.985); }
.prompt-card.selected {
  border-color: var(--accent);
  background: #FBFCF7;
}
.select-num {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 24px;
  height: 24px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}
.prompt-title {
  font-family: 'Klee One', cursive;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
  padding-right: 30px;
}
.prompt-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.tag {
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 10px;
  font-weight: 500;
}
.prompt-preview {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prompt-meta {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-sub);
}
.empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }
.empty-text { font-size: 14px; }
.empty-sub { font-size: 12px; margin-top: 6px; opacity: 0.8; }

.fab {
  position: fixed;
  bottom: 22px;
  right: 22px;
  min-width: 56px;
  height: 56px;
  border-radius: 28px;
  background: var(--accent);
  color: white;
  border: none;
  box-shadow: 0 4px 14px rgba(107, 142, 90, 0.35);
  font-size: 28px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
  z-index: 5;
  padding: 0 18px;
}
.fab:active { transform: scale(0.95); }
.fab.merge-fab { font-size: 14px; font-weight: 600; }

.fab-secondary {
  right: auto;
  left: 22px;
  background: var(--card);
  color: var(--accent-dark);
  border: 1.5px solid var(--accent);
  box-shadow: 0 4px 12px rgba(107, 142, 90, 0.18);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
}
.fab-secondary:active { background: var(--accent-soft); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(40, 30, 18, 0.45);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.18s ease-out; }
.modal {
  background: var(--bg);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.22s ease-out;
  display: flex;
  flex-direction: column;
}
@media (min-width: 600px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: 16px; max-height: 86vh; }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
}
.modal-title {
  font-family: 'Klee One', cursive;
  font-size: 17px;
  font-weight: 600;
  color: var(--accent-dark);
  flex: 1;
  margin-right: 10px;
  word-break: break-word;
}
.modal-close {
  background: none;
  border: none;
  font-size: 26px;
  color: var(--text-sub);
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-body { padding: 14px 16px; flex: 1; }
.form-field { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-sub);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.form-input, .form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 200px; line-height: 1.7; }
.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  position: sticky;
  bottom: 0;
  background: var(--bg);
}
.btn {
  padding: 9px 18px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:active { background: var(--accent-dark); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-ghost { background: none; color: var(--text-sub); }

.detail-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.detail-body {
  background: var(--card);
  border-radius: 8px;
  padding: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 14px;
  line-height: 1.75;
  border: 1px solid var(--border);
  max-height: 50vh;
  overflow-y: auto;
  font-family: 'Zen Maru Gothic', sans-serif;
}
.detail-meta {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 12px;
  line-height: 1.8;
}
.detail-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.action-btn {
  flex: 1;
  min-width: 80px;
  padding: 10px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.action-btn:active { background: var(--accent-soft); transform: scale(0.97); }
.action-btn.danger { color: var(--danger); }
.action-btn.danger:active { background: #F5E3E0; }

.history-item {
  background: var(--card);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.history-date {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 6px;
  font-weight: 500;
}
.history-preview {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  max-height: 90px;
  overflow: hidden;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 8px;
  background: var(--bg-soft);
  padding: 8px 10px;
  border-radius: 6px;
}

.merge-selected-list {
  background: var(--card);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.merge-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
}
.merge-item:not(:last-child) { border-bottom: 1px dashed var(--border); }
.merge-num {
  width: 22px;
  height: 22px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
  font-weight: 600;
}
.separator-options {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.sep-btn {
  padding: 7px 14px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 18px;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.sep-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

.split-chunks {
  background: var(--card);
  border-radius: 8px;
  padding: 8px 4px;
  border: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.7;
  max-height: 50vh;
  overflow-y: auto;
}
.split-line {
  padding: 3px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  min-height: 1em;
}
.split-line.blank {
  color: var(--text-sub);
  opacity: 0.5;
  font-size: 11px;
}
.split-hotspot {
  padding: 6px 0;
  cursor: pointer;
  transition: padding 0.15s;
  margin: 0 8px;
}
.split-thin {
  height: 1px;
  background: var(--border);
  transition: background 0.15s, height 0.15s;
  border-radius: 1px;
}
.split-hotspot:active .split-thin {
  background: var(--accent);
  height: 2px;
}
.split-hotspot.active { padding: 10px 0; }
.split-marker {
  background: var(--accent);
  color: white;
  text-align: center;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.split-checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text);
}
.split-checkbox-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}
.split-info {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--bg-soft);
  border-radius: 6px;
}
.split-info.has-split { color: var(--accent-dark); font-weight: 500; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 0 4px;
  font-size: 13px;
  color: var(--text-sub);
  flex-wrap: wrap;
  overflow-x: auto;
}
.breadcrumb-item {
  background: none;
  border: none;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text-sub);
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.15s;
  white-space: nowrap;
}
.breadcrumb-item:active { background: var(--accent-soft); }
.breadcrumb-item.current {
  color: var(--accent-dark);
  font-weight: 600;
  cursor: default;
}
.breadcrumb-item.current:active { background: none; }
.breadcrumb-sep {
  color: var(--text-sub);
  opacity: 0.5;
  font-size: 12px;
}
.section-label {
  font-size: 11px;
  color: var(--text-sub);
  margin: 14px 4px 6px;
  letter-spacing: 0.05em;
  font-weight: 500;
}
.section-label:first-child { margin-top: 4px; }

.folder-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: transform 0.15s;
  border: 2px solid transparent;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}
.folder-card:active { transform: scale(0.985); }
.folder-icon {
  font-size: 22px;
  flex-shrink: 0;
}
.folder-info { flex: 1; min-width: 0; }
.folder-name {
  font-family: 'Klee One', cursive;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.folder-count {
  font-size: 11px;
  color: var(--text-sub);
}
.folder-arrow {
  color: var(--text-sub);
  opacity: 0.5;
  font-size: 16px;
  flex-shrink: 0;
}

.search-folder-tag {
  display: inline-block;
  background: var(--bg-soft);
  color: var(--text-sub);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  margin-bottom: 4px;
}

.replace-line {
  padding: 4px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  min-height: 1em;
  cursor: pointer;
  margin: 0 4px;
  transition: background 0.12s;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.7;
}
.replace-line:active {
  background: var(--bg-soft);
}
.replace-line.blank {
  color: var(--text-sub);
  opacity: 0.5;
  font-size: 11px;
}
.replace-line.in-range {
  background: var(--accent-soft);
  color: var(--accent-dark);
}
.replace-line.start-only {
  background: var(--accent);
  color: white;
  font-weight: 500;
}
.replace-chunks {
  background: var(--card);
  border-radius: 8px;
  padding: 8px 4px;
  border: 1px solid var(--border);
  max-height: 40vh;
  overflow-y: auto;
  margin-bottom: 10px;
}

.step-context {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.8;
  max-height: 45vh;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.match-highlight {
  background: var(--accent);
  color: white;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
.step-progress {
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 10px;
}
.step-question {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 12px;
  line-height: 1.6;
}
.modal-footer.wrap {
  flex-wrap: wrap;
}
.modal-footer.wrap .btn {
  flex: 1;
  min-width: 70px;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 12px;
}
.header-menu-btn {
  background: none;
  border: none;
  font-size: 28px;
  color: var(--text-sub);
  cursor: pointer;
  padding: 2px 12px;
  border-radius: 10px;
  transition: background 0.15s, color 0.15s;
  line-height: 1;
  font-family: inherit;
}
.header-menu-btn:active {

}

.menu-item:active {

.menu-item-title {

}
.menu-item.danger {

}
.menu-item.danger .menu-item-title {

}

.modal-overlay.fullscreen { align-items: stretch; }
.modal-overlay.fullscreen .modal {
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  border-radius: 0;

}
.modal-overlay.fullscreen .modal-body {

.modal-overlay.fullscreen .form-field.grow {

.modal-overlay.fullscreen .split-chunks,

.guess-btn {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1.5px dashed var(--accent);
  background: var(--card);
  font-family: inherit;

.toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-dark);
  color: white;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 200;
  box-shadow: 0 4px 14px rgba(74, 106, 62, 0.3);
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1 class="app-title">ことのはノート</h1>
    <button class="header-menu-btn" id="menuBtn" aria-label="メニュー">⋯</button>
  </div>
  <input type="search" class="search-bar" id="search" placeholder="検索（タイトル・本文・タグ）">
</header>

<main>
  <div class="list-meta">
    <span id="count">0件</span>
    <button class="merge-toggle" id="mergeToggle">合体モード</button>
  </div>
  <div class="prompt-list" id="list"></div>
</main>

<button class="fab" id="fab">＋</button>
<button class="fab fab-secondary" id="fabDownload" style="display:none;">💾 (0)</button>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'prompts_v1';
const HISTORY_LIMIT = 10;
const SEPARATORS = [
  { key: 'blank', label: '空行', value: '\n\n' },
  { key: 'rule',  label: '罫線', value: '\n\n---\n\n' },
  { key: 'head',  label: '見出し', value: 'HEADING' },
  { key: 'nl',    label: 'なし', value: '\n' },
];

let prompts = [];
let mergeMode = false;
let mergeSelected = [];
let mergeSepKey = 'rule';
let currentPath = ''; // 現在表示中のフォルダパス（ルートは空文字）

// ---------- ストレージ（環境自動判定） ----------
// アーティファクト環境では window.storage、本番(GitHub Pages等)では localStorage を使う
const storage = (() => {
  if (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function') {
    return {
      mode: 'artifact',
      get: async (key) => {
        try {
          const r = await window.storage.get(key);
          return r && r.value ? r.value : null;
        } catch (e) { return null; }
      },
      set: async (key, value) => {
        await window.storage.set(key, value);
      }
    };
  }
  return {
    mode: 'local',
    get: async (key) => {
      try { return localStorage.getItem(key); }
      catch (e) { return null; }
    },
    set: async (key, value) => {
      try { localStorage.setItem(key, value); }
      catch (e) { console.error('保存失敗', e); throw e; }
    }
  };
})();

// ---------- 保存 ----------
async function loadPrompts() {
  try {
    const value = await storage.get(STORAGE_KEY);
    if (value) prompts = JSON.parse(value);
  } catch (e) {
    prompts = [];
  }
}
async function savePrompts() {
  try {
    await storage.set(STORAGE_KEY, JSON.stringify(prompts));
  } catch (e) {
    console.error('保存失敗', e);
    toast('保存に失敗しました');
  }
}

// ---------- ユーティリティ ----------
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function fmtDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  if (d.getFullYear() === now.getFullYear()) {
    return `${d.getMonth()+1}/${d.getDate()}`;
  }
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function fmtFullDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ---------- 一覧描画 ----------
function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  list.innerHTML = '';

  // 検索モード：全体から検索、フォルダ階層は無視
  if (q) {
    const filtered = prompts.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.body || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    ).sort((a, b) => b.updatedAt - a.updatedAt);

    count.textContent = `${filtered.length}件 / 全${prompts.length}件`;

    const bc = renderBreadcrumb(true);
    if (bc) list.appendChild(bc);

    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="empty-icon">📝</div>
        <div class="empty-text">見つかりませんでした</div>`;
      list.appendChild(empty);
      return;
    }
    filtered.forEach(p => list.appendChild(renderPromptCard(p, true)));
    return;
  }

  // 通常モード：currentPath のサブフォルダ + プロンプト
  const bc = renderBreadcrumb(false);
  if (bc) list.appendChild(bc);

  const subFolders = getSubFolders(currentPath);
  const directPrompts = prompts
    .filter(p => (p.folder || '') === currentPath)
    .sort((a, b) => b.updatedAt - a.updatedAt);

  // 合計件数表示
  const totalInScope = prompts.filter(p => {
    const f = p.folder || '';
    return currentPath === '' ? true : (f === currentPath || f.startsWith(currentPath + '/'));
  }).length;
  count.textContent = currentPath ? `${totalInScope}件` : `${prompts.length}件`;

  // 空チェック
  if (subFolders.length === 0 && directPrompts.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `
      <div class="empty-icon">📝</div>
      <div class="empty-text">${currentPath ? 'このフォルダは空です' : 'まだプロンプトがありません'}</div>
      <div class="empty-sub">右下の＋から追加</div>`;
    list.appendChild(empty);
    return;
  }

  // フォルダセクション
  if (subFolders.length > 0) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'フォルダ';
    list.appendChild(label);
    subFolders.forEach(name => list.appendChild(renderFolderCard(name)));
  }

  // プロンプトセクション
  if (directPrompts.length > 0) {
    if (subFolders.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'プロンプト';
      list.appendChild(label);
    }
    directPrompts.forEach(p => list.appendChild(renderPromptCard(p, false)));
  }
}

function renderBreadcrumb(isSearch) {
  if (!currentPath && !isSearch) return null;
  const bc = document.createElement('div');
  bc.className = 'breadcrumb';

  if (isSearch) {
    const item = document.createElement('span');
    item.className = 'breadcrumb-item current';
    item.textContent = '🔍 検索結果';
    bc.appendChild(item);
    if (currentPath) {
      const sub = document.createElement('span');
      sub.className = 'breadcrumb-sep';
      sub.textContent = `（${currentPath} 含む全体から）`;
      sub.style.fontSize = '11px';
      bc.appendChild(sub);
    }
    return bc;
  }

  const home = document.createElement('button');
  home.className = 'breadcrumb-item';
  home.textContent = '🏠 ホーム';
  home.addEventListener('click', () => navigateTo(''));
  bc.appendChild(home);

  const parts = currentPath.split('/');
  let pathSoFar = '';
  parts.forEach((part, i) => {
    pathSoFar = pathSoFar ? `${pathSoFar}/${part}` : part;
    const sep = document.createElement('span');
    sep.className = 'breadcrumb-sep';
    sep.textContent = '›';
    bc.appendChild(sep);

    const isLast = i === parts.length - 1;
    const btn = document.createElement('button');
    btn.className = 'breadcrumb-item' + (isLast ? ' current' : '');
    btn.textContent = part;
    if (!isLast) {
      const nav = pathSoFar;
      btn.addEventListener('click', () => navigateTo(nav));
    }
    bc.appendChild(btn);
  });
  return bc;
}

function getSubFolders(path) {
  const set = new Set();
  prompts.forEach(p => {
    const folder = p.folder || '';
    if (folder === path) return;
    if (path === '') {
      const first = folder.split('/')[0];
      if (first) set.add(first);
    } else if (folder.startsWith(path + '/')) {
      const rest = folder.slice(path.length + 1);
      const first = rest.split('/')[0];
      if (first) set.add(first);
    }
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
}

function navigateTo(path) {
  currentPath = path;
  document.getElementById('search').value = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderFolderCard(folderName) {
  const folderPath = currentPath ? `${currentPath}/${folderName}` : folderName;
  const count = prompts.filter(p => {
    const f = p.folder || '';
    return f === folderPath || f.startsWith(folderPath + '/');
  }).length;

  const card = document.createElement('div');
  card.className = 'folder-card';
  card.innerHTML = `
    <div class="folder-icon">📁</div>
    <div class="folder-info">
      <div class="folder-name">${escapeHtml(folderName)}</div>
      <div class="folder-count">${count}件</div>
    </div>
    <div class="folder-arrow">›</div>`;
  card.addEventListener('click', () => navigateTo(folderPath));
  return card;
}

function renderPromptCard(p, showFolder) {
  const card = document.createElement('div');
  const selIdx = mergeSelected.indexOf(p.id);
  card.className = 'prompt-card' + (selIdx >= 0 ? ' selected' : '');
  card.dataset.id = p.id;

  const selectedBadge = selIdx >= 0 ? `<div class="select-num">${selIdx + 1}</div>` : '';
  const tagsHtml = (p.tags && p.tags.length)
    ? `<div class="prompt-tags">${p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
    : '';
  const folderTag = (showFolder && p.folder)
    ? `<div class="search-folder-tag">📁 ${escapeHtml(p.folder)}</div>`
    : '';
  const preview = (p.body || '').replace(/\s+/g, ' ').slice(0, 80);
  const histInfo = p.history && p.history.length ? `📚 ${p.history.length}版` : '';

  card.innerHTML = `
    ${selectedBadge}
    ${folderTag}
    <div class="prompt-title">${escapeHtml(p.title || '(無題)')}</div>
    ${tagsHtml}
    <div class="prompt-preview">${escapeHtml(preview)}</div>
    <div class="prompt-meta">
      <span>${histInfo}</span>
      <span>${fmtDate(p.updatedAt)}</span>
    </div>`;

  card.addEventListener('click', () => {
    if (mergeMode) toggleMergeSelect(p.id);
    else openDetail(p.id);
  });
  return card;
}

// ---------- モーダル ----------
function openModal(html, fullscreen) {
  document.getElementById('modalContent').innerHTML = html;
  const overlay = document.getElementById('modal');
  overlay.classList.toggle('fullscreen', !!fullscreen);
  overlay.classList.add('active');
}
function closeModal() {
  const overlay = document.getElementById('modal');
  overlay.classList.remove('active');
  overlay.classList.remove('fullscreen');
}

// ---------- 詳細 ----------
function openDetail(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const tagsHtml = (p.tags && p.tags.length)
    ? `<div class="detail-tags">${p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
    : '';
  const folderHtml = p.folder
    ? `<div class="search-folder-tag">📁 ${escapeHtml(p.folder)}</div>`
    : '';
  const hasHistory = p.history && p.history.length;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${escapeHtml(p.title || '(無題)')}</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      ${folderHtml}
      ${tagsHtml}
      <div class="detail-body">${escapeHtml(p.body)}</div>
      <div class="detail-meta">
        作成: ${fmtFullDate(p.createdAt)}<br>
        更新: ${fmtFullDate(p.updatedAt)}
        ${hasHistory ? `<br>履歴: ${p.history.length}版` : ''}
      </div>
      <div class="detail-actions">
        <button class="action-btn" data-action="copy">📋 コピー</button>
        <button class="action-btn" data-action="partialcopy">📑 一部</button>
        <button class="action-btn" data-action="savefile">💾 保存</button>
        <button class="action-btn" data-action="edit">✏️ 編集</button>
        <button class="action-btn" data-action="replace">🔄 差し替え</button>
        <button class="action-btn" data-action="replacetext">🔁 置換</button>
        <button class="action-btn" data-action="split">✂️ 分割</button>
        ${hasHistory ? `<button class="action-btn" data-action="history">📚 履歴</button>` : ''}
        <button class="action-btn danger" data-action="delete">🗑 削除</button>
      </div>
    </div>
  `, true);

  document.getElementById('modalContent').querySelectorAll('[data-action]').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.action;
      if (a === 'close') closeModal();
      else if (a === 'copy') copyPrompt(id);
      else if (a === 'partialcopy') openPartialCopy(id);
      else if (a === 'savefile') openSaveFile(id);
      else if (a === 'edit') openEdit(id);
      else if (a === 'replace') openReplace(id);
      else if (a === 'replacetext') openReplaceText(id);
      else if (a === 'split') openSplit(id);
      else if (a === 'history') openHistory(id);
      else if (a === 'delete') deletePrompt(id);
    });
  });
}

async function copyPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  try {
    await navigator.clipboard.writeText(p.body || '');
    toast('コピーしました');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = p.body || '';
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('コピーしました'); }
    catch { toast('コピーできませんでした'); }
    document.body.removeChild(ta);
  }
}

async function deletePrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`「${p.title || '(無題)'}」を削除しますか？\n（履歴も一緒に消えます）`)) return;
  prompts = prompts.filter(x => x.id !== id);
  await savePrompts();
  closeModal();
  render();
  toast('削除しました');
}

// ---------- 編集 ----------
function openEdit(id) {
  const p = id ? prompts.find(x => x.id === id) : null;
  const isNew = !p;
  const defaultFolder = isNew ? currentPath : (p.folder || '');

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew ? '新規プロンプト' : '編集'}</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">タイトル</label>
        <input type="text" class="form-input" id="editTitle" value="${escapeHtml(p ? p.title : '')}" placeholder="タイトル">
      </div>
      <div class="form-field">
        <label class="form-label">フォルダ（／で区切ると階層になる、空欄はホーム）</label>
        <input type="text" class="form-input" id="editFolder" value="${escapeHtml(defaultFolder)}" placeholder="例: ルルイエ/キャラ">
      </div>
      <div class="form-field">
        <label class="form-label">タグ（カンマ区切り）</label>
        <input type="text" class="form-input" id="editTags" value="${escapeHtml(p ? (p.tags || []).join(', ') : '')}" placeholder="例: 設定, システム">
      </div>
      <div class="form-field grow">
        <label class="form-label">本文</label>
        <textarea class="form-textarea" id="editBody" placeholder="プロンプト本文">${escapeHtml(p ? p.body : '')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
      <button class="btn btn-primary" data-action="save">保存</button>
    </div>
  `, true);

  document.getElementById('modalContent').querySelectorAll('[data-action]').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.action;
      if (a === 'close') closeModal();
      else if (a === 'save') savePrompt(id);
    });
  });
}

function normalizeFolder(raw) {
  // 前後の空白を取り、連続するスラッシュを1つに、前後のスラッシュを削る
  return (raw || '')
    .trim()
    .replace(/\\/g, '/')
    .replace(/\/+/g, '/')
    .replace(/^\/+|\/+$/g, '');
}

async function savePrompt(id) {
  const title = document.getElementById('editTitle').value.trim();
  const body = document.getElementById('editBody').value;
  const folder = normalizeFolder(document.getElementById('editFolder').value);
  const tags = document.getElementById('editTags').value
    .split(',').map(t => t.trim()).filter(t => t);

  if (!title && !body) {
    toast('タイトルか本文を入れてね');
    return;
  }

  const now = Date.now();

  if (id) {
    const p = prompts.find(x => x.id === id);
    if (p) {
      const changed = p.title !== title || p.body !== body
        || JSON.stringify(p.tags || []) !== JSON.stringify(tags)
        || (p.folder || '') !== folder;
      if (changed) {
        if (!p.history) p.history = [];
        p.history.unshift({
          title: p.title, body: p.body, tags: p.tags, folder: p.folder, savedAt: p.updatedAt
        });
        if (p.history.length > HISTORY_LIMIT) p.history = p.history.slice(0, HISTORY_LIMIT);
      }
      p.title = title;
      p.body = body;
      p.tags = tags;
      p.folder = folder;
      p.updatedAt = now;
    }
  } else {
    prompts.push({
      id: uid(), title, body, tags, folder,
      createdAt: now, updatedAt: now, history: []
    });
  }

  await savePrompts();
  closeModal();
  render();
  toast(id ? '保存しました' : '追加しました');
}

// ---------- 履歴 ----------
function openHistory(id) {
  const p = prompts.find(x => x.id === id);
  if (!p || !p.history || !p.history.length) return;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">📚 履歴</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">
        「${escapeHtml(p.title || '(無題)')}」の過去の版
      </div>
      ${p.history.map((h, i) => `
        <div class="history-item">
          <div class="history-date">${fmtFullDate(h.savedAt)} の版</div>
          <div class="history-preview">${escapeHtml(h.body || '(本文なし)')}</div>
          <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;" data-restore="${i}">この版に戻す</button>
        </div>
      `).join('')}
    </div>
  `);

  const root = document.getElementById('modalContent');
  root.querySelector('[data-action="close"]').addEventListener('click', closeModal);
  root.querySelectorAll('[data-restore]').forEach(b => {
    b.addEventListener('click', () => restoreHistory(id, parseInt(b.dataset.restore, 10)));
  });
}

async function restoreHistory(id, idx) {
  const p = prompts.find(x => x.id === id);
  if (!p || !p.history || !p.history[idx]) return;
  if (!confirm('現在の内容を履歴に保存して、選んだ版に戻します。よろしい？')) return;

  const h = p.history[idx];
  // 現在を履歴の先頭に
  p.history.unshift({
    title: p.title, body: p.body, tags: p.tags, folder: p.folder, savedAt: p.updatedAt
  });
  // 選んだ版を本体に
  p.title = h.title;
  p.body = h.body;
  p.tags = h.tags;
  if (h.folder !== undefined) p.folder = h.folder; // 古い履歴にはfolderが無いかも
  p.updatedAt = Date.now();
  // 戻した版を履歴から消す（unshiftで1つズレてるので idx+1）
  p.history.splice(idx + 1, 1);
  if (p.history.length > HISTORY_LIMIT) p.history = p.history.slice(0, HISTORY_LIMIT);

  await savePrompts();
  closeModal();
  render();
  toast('戻しました');
}

// ---------- 合体 ----------
function toggleMergeMode() {
  mergeMode = !mergeMode;
  mergeSelected = [];
  const btn = document.getElementById('mergeToggle');
  btn.classList.toggle('active', mergeMode);
  btn.textContent = mergeMode ? '選択モード解除' : '選択モード';

  const fab = document.getElementById('fab');
  const fabDl = document.getElementById('fabDownload');
  if (mergeMode) {
    fab.classList.add('merge-fab');
    fab.textContent = '合体する (0)';
    fabDl.style.display = 'flex';
    fabDl.textContent = '💾 (0)';
  } else {
    fab.classList.remove('merge-fab');
    fab.textContent = '＋';
    fabDl.style.display = 'none';
  }
  render();
}

function toggleMergeSelect(id) {
  const idx = mergeSelected.indexOf(id);
  if (idx >= 0) mergeSelected.splice(idx, 1);
  else mergeSelected.push(id);
  document.getElementById('fab').textContent = `合体する (${mergeSelected.length})`;
  document.getElementById('fabDownload').textContent = `💾 (${mergeSelected.length})`;
  render();
}

function getSeparator() {
  return SEPARATORS.find(s => s.key === mergeSepKey) || SEPARATORS[1];
}

function buildMerged(selected) {
  const sep = getSeparator();
  if (sep.value === 'HEADING') {
    return selected.map(p => `## ${p.title || '(無題)'}\n\n${p.body || ''}`).join('\n\n');
  }
  return selected.map(p => p.body || '').join(sep.value);
}

function openMerge() {
  if (mergeSelected.length < 2) {

    return;
  }
  const selected = mergeSelected.map(id => prompts.find(p => p.id === id)).filter(Boolean);

async function saveMerged(selected) {
  const body = buildMerged(selected);
  const title = '合体: ' + selected.map(p => p.title || '(無題)').join(' + ').slice(0, 50);
  const now = Date.now();

  // 全選択が同じフォルダなら、そのフォルダ。違うなら、現在のパス。
  const folders = new Set(selected.map(p => p.folder || ''));
  const folder = folders.size === 1 ? [...folders][0] : currentPath;

  prompts.push({
    id: uid(), title, body, tags: ['合体'], folder,
    createdAt: now, updatedAt: now, history: []
  });
  await savePrompts();
  closeModal();
  toggleMergeMode();
  toast('合体しました');
}

async function downloadSelectedFiles(ext, mime) {
  const selected = mergeSelected.map(id => prompts.find(p => p.id === id)).filter(Boolean);
  if (selected.length === 0) return;

  const files = selected.map(p => {
    const filename = `${safeFilename(p.title, 80)}.${ext}`;
    const content = p.body || '';
    return new File([content], filename, { type: mime + ';charset=utf-8' });
  });

  // navigator.share対応端末（モバイルChromeなど）
  if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files, title: `${selected.length}件のプロンプト` });
      const count = selected.length;
      toggleMergeMode(); // 選択解除
      toast(`${count}件を共有しました`);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // ユーザーキャンセル
      // 他のエラーはフォールバックへ
    }
  }

  // フォールバック：連続ダウンロード
  if (!confirm(`${selected.length}個のファイルを連続でダウンロードします。\nブラウザが「複数ファイルを許可しますか？」と聞いてきたら「許可」を選んでね。\n続行する？`)) return;

  for (const file of files) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    await new Promise(r => setTimeout(r, 120));
    URL.revokeObjectURL(url);
  }
  const count = selected.length;
  toggleMergeMode();
  toast(`${count}件をダウンロードしました`);
}

// ---------- 部分コピー ----------
function openPartialCopy(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const lines = (p.body || '').split('\n');
  let startIdx = null;
  let endIdx = null;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">📑 一部コピー</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.6;">
        「${escapeHtml(p.title || '(無題)')}」から一部を取り出してコピーします。<br>
        範囲の開始行と終了行をタップ（1行だけなら同じ行を2回）
      </div>

      <div id="copyStatus" class="split-info" style="margin-bottom:10px;">範囲の開始行をタップ</div>

      <div id="copyChunks" class="replace-chunks"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
      <button class="btn btn-secondary" data-action="clear">範囲リセット</button>
      <button class="btn btn-primary" data-action="execute">コピー</button>
    </div>
  `, true);

  function renderCopyLines() {
    const container = document.getElementById('copyChunks');
    container.innerHTML = '';
    lines.forEach((line, i) => {
      const isBlank = line.trim() === '';
      const rangeStart = startIdx !== null ? Math.min(startIdx, endIdx === null ? startIdx : endIdx) : null;
      const rangeEnd = startIdx !== null ? Math.max(startIdx, endIdx === null ? startIdx : endIdx) : null;
      const inRange = (rangeStart !== null && i >= rangeStart && i <= rangeEnd);
      const startOnly = (startIdx !== null && endIdx === null && i === startIdx);

      const lineEl = document.createElement('div');
      lineEl.className = 'replace-line'
        + (isBlank ? ' blank' : '')
        + (startOnly ? ' start-only' : (inRange ? ' in-range' : ''));
      lineEl.textContent = isBlank ? '(空行)' : line;

      lineEl.addEventListener('click', () => {
        if (startIdx === null) startIdx = i;
        else if (endIdx === null) endIdx = i;
        else { startIdx = i; endIdx = null; }
        renderCopyLines();
        updateCopyStatus();
      });
      container.appendChild(lineEl);
    });
  }

  function updateCopyStatus() {
    const status = document.getElementById('copyStatus');
    if (startIdx === null) {
      status.textContent = '範囲の開始行をタップ';
      status.classList.remove('has-split');
      return;
    }
    if (endIdx === null) {
      status.textContent = '終了行をタップ（1行だけなら同じ行をもう一度）';
      status.classList.remove('has-split');
      return;
    }
    const start = Math.min(startIdx, endIdx);
    const end = Math.max(startIdx, endIdx);
    status.textContent = `${end - start + 1}行をコピーします`;
    status.classList.add('has-split');
  }

  renderCopyLines();
  updateCopyStatus();

  const root = document.getElementById('modalContent');
  root.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="clear"]').addEventListener('click', () => {
    startIdx = null; endIdx = null;
    renderCopyLines();
    updateCopyStatus();
  });
  root.querySelector('[data-action="execute"]').addEventListener('click', () => {
    if (startIdx === null || endIdx === null) {
      toast('範囲を選んでね');
      return;
    }
    performPartialCopy(lines, startIdx, endIdx);
  });
}

async function performPartialCopy(lines, startIdx, endIdx) {
  const start = Math.min(startIdx, endIdx);
  const end = Math.max(startIdx, endIdx);
  const text = lines.slice(start, end + 1).join('\n');
  const lineCount = end - start + 1;

  try {
    await navigator.clipboard.writeText(text);
    closeModal();
    toast(`${lineCount}行をコピーしました`);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      closeModal();
      toast(`${lineCount}行をコピーしました`);
    } catch {
      toast('コピーできませんでした');
    }
    document.body.removeChild(ta);
  }
}

function openReplaceText(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🔁 置換</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.6;">
        「${escapeHtml(p.title || '(無題)')}」の中の文字を一括置換します。
      </div>

      <div class="form-field">
        <label class="form-label">検索する文字</label>
        <input type="text" class="form-input" id="findText" placeholder="探す文字">
      </div>

      <div class="form-field">
        <label class="form-label">置換する文字（空欄なら削除）</label>
        <input type="text" class="form-input" id="newText" placeholder="新しい文字">
      </div>

      <div class="form-field">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
          <input type="checkbox" id="caseSensitive" style="width:16px;height:16px;accent-color:var(--accent);">
          大文字小文字を区別する
        </label>
      </div>

      <div id="replaceTextStatus" class="split-info">検索する文字を入力</div>
    </div>
    <div class="modal-footer wrap">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
      <button class="btn btn-secondary" data-action="step">ひとつずつ</button>
      <button class="btn btn-primary" data-action="execute">すべて置換</button>
    </div>
  `);

  function countMatches(body, findStr, caseSensitive) {
    if (!findStr) return 0;
    if (caseSensitive) {
      return body.split(findStr).length - 1;
    } else {
      const escaped = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const matches = body.match(new RegExp(escaped, 'gi'));
      return matches ? matches.length : 0;
    }
  }

  function updateStatus() {
    const findStr = document.getElementById('findText').value;
    const caseSensitive = document.getElementById('caseSensitive').checked;
    const status = document.getElementById('replaceTextStatus');

    if (!findStr) {
      status.textContent = '検索する文字を入力';
      status.classList.remove('has-split');
      return;
    }

    const count = countMatches(p.body, findStr, caseSensitive);
    if (count === 0) {
      status.textContent = '見つかりませんでした';
      status.classList.remove('has-split');
    } else {
      status.textContent = `${count}か所が置換されます`;
      status.classList.add('has-split');
    }
  }

  ['findText', 'newText', 'caseSensitive'].forEach(eid => {
    const el = document.getElementById(eid);
    el.addEventListener('input', updateStatus);
    el.addEventListener('change', updateStatus);
  });

  const root = document.getElementById('modalContent');
  root.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="step"]').addEventListener('click', () => {
    startStepReplace(id);
  });
  root.querySelector('[data-action="execute"]').addEventListener('click', () => {
    performReplaceText(id);
  });
}

async function performReplaceText(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const findStr = document.getElementById('findText').value;
  const replaceStr = document.getElementById('newText').value;
  const caseSensitive = document.getElementById('caseSensitive').checked;

  if (!findStr) {
    toast('検索する文字を入れてね');
    return;
  }

  let newBody;
  let count = 0;

  if (caseSensitive) {
    const parts = p.body.split(findStr);
    count = parts.length - 1;
    newBody = parts.join(replaceStr);
  } else {
    const escaped = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escaped, 'gi');
    const matches = p.body.match(regex);
    count = matches ? matches.length : 0;
    newBody = p.body.replace(regex, replaceStr);
  }

  if (count === 0) {
    toast('見つかりませんでした');
    return;
  }

  if (!confirm(`${count}か所を「${findStr}」→「${replaceStr || '(削除)'}」に置換します。\n元に戻したいときは履歴から戻せます。よろしい？`)) {
    return;
  }

  // 履歴に保存
  if (!p.history) p.history = [];
  p.history.unshift({
    title: p.title, body: p.body, tags: p.tags, folder: p.folder, savedAt: p.updatedAt
  });
  if (p.history.length > HISTORY_LIMIT) p.history = p.history.slice(0, HISTORY_LIMIT);

  p.body = newBody;
  p.updatedAt = Date.now();

  await savePrompts();
  closeModal();
  render();
  toast(`${count}か所を置換しました`);
}

// ---------- ひとつずつ置換 ----------
let stepReplaceState = null;

function findAllMatches(body, findStr, caseSensitive) {
  const matches = [];
  if (!findStr) return matches;
  if (caseSensitive) {
    let pos = 0;
    while (true) {
      const i = body.indexOf(findStr, pos);
      if (i === -1) break;
      matches.push({ start: i, end: i + findStr.length });
      pos = i + findStr.length;
    }
  } else {
    const escaped = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escaped, 'gi');
    let m;
    while ((m = regex.exec(body)) !== null) {
      matches.push({ start: m.index, end: m.index + m[0].length });
      if (m[0].length === 0) regex.lastIndex++;
    }
  }
  return matches;
}

function startStepReplace(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const findStr = document.getElementById('findText').value;
  const replaceStr = document.getElementById('newText').value;
  const caseSensitive = document.getElementById('caseSensitive').checked;

  if (!findStr) {
    toast('検索する文字を入れてね');
    return;
  }

  const matches = findAllMatches(p.body, findStr, caseSensitive);
  if (matches.length === 0) {
    toast('見つかりませんでした');
    return;
  }

  stepReplaceState = {
    id, findStr, replaceStr, caseSensitive,
    originalBody: p.body,
    currentBody: p.body,
    matches,
    currentIdx: 0,
    replaceCount: 0,
    skipCount: 0,
  };
  showStepReplaceUI();
}

function showStepReplaceUI() {
  const s = stepReplaceState;
  if (!s) return;
  const match = s.matches[s.currentIdx];

  // 文脈表示（前後150文字くらい）
  const contextBefore = 150;
  const contextAfter = 150;
  const start = Math.max(0, match.start - contextBefore);
  const end = Math.min(s.currentBody.length, match.end + contextAfter);

  const before = s.currentBody.slice(start, match.start);
  const matchText = s.currentBody.slice(match.start, match.end);
  const after = s.currentBody.slice(match.end, end);
  const beforeEllipsis = start > 0 ? '…' : '';
  const afterEllipsis = end < s.currentBody.length ? '…' : '';

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🔁 ひとつずつ置換</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div class="step-progress">
        ${s.currentIdx + 1} / ${s.matches.length} か所目
        ${s.replaceCount > 0 ? `（済 ${s.replaceCount}）` : ''}
        ${s.skipCount > 0 ? `（飛 ${s.skipCount}）` : ''}
      </div>

      <div class="step-context">${escapeHtml(beforeEllipsis)}${escapeHtml(before)}<span class="match-highlight">${escapeHtml(matchText)}</span>${escapeHtml(after)}${escapeHtml(afterEllipsis)}</div>

      <div class="step-question">
        <strong style="color:var(--text);">「${escapeHtml(s.findStr)}」</strong> を 
        <strong style="color:var(--accent-dark);">「${escapeHtml(s.replaceStr || '(削除)')}」</strong> に置き換える？
      </div>
    </div>
    <div class="modal-footer wrap">
      <button class="btn btn-ghost" data-action="abort">中断</button>
      <button class="btn btn-secondary" data-action="skip">飛ばす</button>
      <button class="btn btn-secondary" data-action="restAll">残り全部</button>
      <button class="btn btn-primary" data-action="replace">置換</button>
    </div>
  `, true);

  const root = document.getElementById('modalContent');
  root.querySelector('[data-action="close"]').addEventListener('click', () => askAbort());
  root.querySelector('[data-action="abort"]').addEventListener('click', () => askAbort());
  root.querySelector('[data-action="skip"]').addEventListener('click', stepSkip);
  root.querySelector('[data-action="replace"]').addEventListener('click', stepReplace);
  root.querySelector('[data-action="restAll"]').addEventListener('click', stepReplaceRest);
}

function askAbort() {
  const s = stepReplaceState;
  if (!s) { closeModal(); return; }
  if (s.replaceCount > 0) {
    if (confirm(`ここまで ${s.replaceCount}か所 置換しました。\n「OK」で確定、「キャンセル」で全部なかったことに。`)) {
      commitStepReplace();
    } else {
      stepReplaceState = null;
      closeModal();
    }
  } else {
    stepReplaceState = null;
    closeModal();
  }
}

function stepNext() {
  const s = stepReplaceState;
  s.currentIdx++;
  if (s.currentIdx >= s.matches.length) {
    finishStepReplace();
  } else {
    showStepReplaceUI();
  }
}

function stepSkip() {
  stepReplaceState.skipCount++;
  stepNext();
}

function stepReplace() {
  const s = stepReplaceState;
  const match = s.matches[s.currentIdx];

  s.currentBody =
    s.currentBody.slice(0, match.start) +
    s.replaceStr +
    s.currentBody.slice(match.end);
  s.replaceCount++;

  // 後続のマッチ位置をずらす
  const delta = s.replaceStr.length - (match.end - match.start);
  for (let i = s.currentIdx + 1; i < s.matches.length; i++) {
    s.matches[i].start += delta;
    s.matches[i].end += delta;
  }

  stepNext();
}

function stepReplaceRest() {
  const s = stepReplaceState;
  const remaining = s.matches.length - s.currentIdx;
  if (!confirm(`残り ${remaining}か所 を全部置換する？`)) return;

  while (s.currentIdx < s.matches.length) {
    const match = s.matches[s.currentIdx];
    s.currentBody =
      s.currentBody.slice(0, match.start) +
      s.replaceStr +
      s.currentBody.slice(match.end);
    s.replaceCount++;

    const delta = s.replaceStr.length - (match.end - match.start);
    for (let i = s.currentIdx + 1; i < s.matches.length; i++) {
      s.matches[i].start += delta;
      s.matches[i].end += delta;
    }
    s.currentIdx++;
  }
  finishStepReplace();
}

function finishStepReplace() {
  const s = stepReplaceState;
  if (s.replaceCount === 0) {
    toast('置換しませんでした');
    stepReplaceState = null;
    closeModal();
    return;
  }
  commitStepReplace();
}

async function commitStepReplace() {
  const s = stepReplaceState;
  if (!s) return;
  const p = prompts.find(x => x.id === s.id);
  if (!p) return;

  // 元の本文を履歴に保存
  if (!p.history) p.history = [];
  p.history.unshift({
    title: p.title, body: s.originalBody, tags: p.tags, folder: p.folder, savedAt: p.updatedAt
  });
  if (p.history.length > HISTORY_LIMIT) p.history = p.history.slice(0, HISTORY_LIMIT);

  p.body = s.currentBody;
  p.updatedAt = Date.now();

  await savePrompts();
  toast(`${s.replaceCount}か所を置換しました`);
  stepReplaceState = null;
  closeModal();
  render();
}

// ---------- 差し替え ----------

// 文字bigramのセットを作る（比較用に空白は除去）
function makeBigrams(text) {
  const s = text.replace(/\s+/g, '');
  const set = new Set();
  for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2));
  return set;
}

// 貼り付けテキストに一番似ている連続行範囲を探す
function guessRange(bodyLines, pastedText) {
  const target = makeBigrams(pastedText);
  if (target.size === 0) return { score: 0, start: -1, end: -1 };

  const pLineCount = pastedText.split('\n').filter(l => l.trim()).length || 1;
  const minLen = Math.max(1, Math.floor(pLineCount * 0.4));
  const maxLen = Math.min(bodyLines.length, Math.ceil(pLineCount * 2.5) + 2);

  let best = { score: 0, start: -1, end: -1 };

  for (let start = 0; start < bodyLines.length; start++) {
    const current = new Set();
    let common = 0;
    const limit = Math.min(start + maxLen, bodyLines.length);
    for (let end = start; end < limit; end++) {
      const lineText = bodyLines[end].replace(/\s+/g, '');
      for (let i = 0; i < lineText.length - 1; i++) {
        const bg = lineText.slice(i, i + 2);
        if (!current.has(bg)) {
          current.add(bg);
          if (target.has(bg)) common++;
        }
      }
      const len = end - start + 1;
      if (len < minLen) continue;
      const union = current.size + target.size - common;
      const s = union > 0 ? common / union : 0;
      if (s > best.score) best = { score: s, start, end };
    }
  }
  return best;
}

function openReplace(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const lines = (p.body || '').split('\n');
  let startIdx = null;
  let endIdx = null;
  let lastShownRange = null;
  let userEdited = false; // ユーザーがテキストエリアを触ったら自動流し込みしない

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🔄 差し替え</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.6;">
        「${escapeHtml(p.title || '(無題)')}」の一部を差し替えます。<br>
        新しい内容を貼り付けて推測させるか、下の行リストで範囲をタップ
      </div>

      <div style="margin-bottom:10px;">
        <label class="form-label">新しい内容</label>
        <textarea class="form-textarea" id="replaceText" placeholder="ここに新しい内容を貼り付け" style="min-height:110px;"></textarea>
      </div>

      <button class="guess-btn" data-action="guess">🔍 貼り付けから範囲を推測</button>

      <div id="replaceStatus" class="split-info" style="margin-bottom:10px;">貼り付けて推測するか、行をタップして範囲指定</div>

      <div id="replaceChunks" class="replace-chunks"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
      <button class="btn btn-secondary" data-action="clear">範囲リセット</button>
      <button class="btn btn-primary" data-action="execute">差し替える</button>
    </div>
  `, true);

  function renderReplaceLines() {
    const container = document.getElementById('replaceChunks');
    container.innerHTML = '';
    lines.forEach((line, i) => {
      const isBlank = line.trim() === '';
      const rangeStart = startIdx !== null ? Math.min(startIdx, endIdx === null ? startIdx : endIdx) : null;
      const rangeEnd = startIdx !== null ? Math.max(startIdx, endIdx === null ? startIdx : endIdx) : null;
      const inRange = (rangeStart !== null && i >= rangeStart && i <= rangeEnd);
      const startOnly = (startIdx !== null && endIdx === null && i === startIdx);

      const lineEl = document.createElement('div');
      lineEl.className = 'replace-line'
        + (isBlank ? ' blank' : '')
        + (startOnly ? ' start-only' : (inRange ? ' in-range' : ''));
      lineEl.textContent = isBlank ? '(空行)' : line;
      lineEl.dataset.line = i;

      lineEl.addEventListener('click', () => {
        if (startIdx === null) {
          startIdx = i;
        } else if (endIdx === null) {
          endIdx = i;
        } else {
          startIdx = i;
          endIdx = null;
        }
        renderReplaceLines();
        updateStatus();
      });
      container.appendChild(lineEl);
    });
  }

  function updateStatus(customMsg) {
    const status = document.getElementById('replaceStatus');

    if (customMsg) {
      status.textContent = customMsg.text;
      status.classList.toggle('has-split', !!customMsg.good);
      return;
    }

    if (startIdx === null) {
      status.textContent = '貼り付けて推測するか、行をタップして範囲指定';
      status.classList.remove('has-split');
      lastShownRange = null;
      return;
    }
    if (endIdx === null) {
      status.textContent = '範囲の終了行をタップ（1行だけなら同じ行をもう一度）';
      status.classList.remove('has-split');
      lastShownRange = null;
      return;
    }

    const start = Math.min(startIdx, endIdx);
    const end = Math.max(startIdx, endIdx);
    const lineCount = end - start + 1;
    status.textContent = `${lineCount}行を差し替えます`;
    status.classList.add('has-split');

    // ユーザーが手で書いてない時だけ、現在の範囲テキストを流し込み
    const rangeKey = `${start}-${end}`;
    if (!userEdited && lastShownRange !== rangeKey) {
      const currentText = lines.slice(start, end + 1).join('\n');
      document.getElementById('replaceText').value = currentText;
      lastShownRange = rangeKey;
    }
  }

  function runGuess() {
    const pasted = document.getElementById('replaceText').value;
    if (!pasted.trim()) {
      toast('先に新しい内容を貼り付けてね');
      return;
    }
    userEdited = true; // 貼り付け内容を保護

    const result = guessRange(lines, pasted);
    if (result.start === -1 || result.score < 0.3) {
      updateStatus({ text: 'うまく見つけられなかった…行をタップして手動で選んでね', good: false });
      return;
    }

    startIdx = result.start;
    endIdx = result.end;
    renderReplaceLines();

    const pct = Math.round(result.score * 100);
    const lineCount = result.end - result.start + 1;
    updateStatus({ text: `この範囲かな？（一致度 ${pct}%・${lineCount}行）違ったら行タップで調整してね`, good: true });

    // 推測範囲までスクロール
    const container = document.getElementById('replaceChunks');
    const targetEl = container.querySelector(`[data-line="${result.start}"]`);
    if (targetEl) targetEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  renderReplaceLines();
  updateStatus();

  document.getElementById('replaceText').addEventListener('input', () => { userEdited = true; });

  const root = document.getElementById('modalContent');
  root.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="guess"]').addEventListener('click', runGuess);
  root.querySelector('[data-action="clear"]').addEventListener('click', () => {
    startIdx = null;
    endIdx = null;
    lastShownRange = null;
    userEdited = false;
    document.getElementById('replaceText').value = '';
    renderReplaceLines();
    updateStatus();
  });
  root.querySelector('[data-action="execute"]').addEventListener('click', () => {
    if (startIdx === null || endIdx === null) {
      toast('範囲を選んでね');
      return;
    }
    performReplace(id, lines, startIdx, endIdx);
  });
}

async function performReplace(id, lines, startIdx, endIdx) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const newText = document.getElementById('replaceText').value;
  const start = Math.min(startIdx, endIdx);
  const end = Math.max(startIdx, endIdx);

  // 履歴に保存
  if (!p.history) p.history = [];
  p.history.unshift({
    title: p.title, body: p.body, tags: p.tags, folder: p.folder, savedAt: p.updatedAt
  });
  if (p.history.length > HISTORY_LIMIT) p.history = p.history.slice(0, HISTORY_LIMIT);

  // 本文を更新（指定範囲を新しいテキストで差し替え）
  const newLines = [
    ...lines.slice(0, start),
    ...newText.split('\n'),
    ...lines.slice(end + 1)
  ];
  p.body = newLines.join('\n');
  p.updatedAt = Date.now();

  await savePrompts();
  closeModal();
  render();
  toast('差し替えました');
}

// ---------- 分割 ----------
function openSplit(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  const lines = (p.body || '').split('\n');
  let splitIndices = []; // 各要素は「この行の後で分割する」というindex

  openModal(`
    <div class="modal-header">
      <div class="modal-title">✂️ 分割</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.6;">
        「${escapeHtml(p.title || '(無題)')}」を分けます。<br>
        行と行の間の細い線をタップ → そこに分割線が入る（複数OK）
      </div>

      <div id="splitChunks" class="split-chunks"></div>

      <div class="split-checkbox-row">
        <input type="checkbox" id="keepOriginal" checked>
        <label for="keepOriginal">元のプロンプトを残す</label>
      </div>

      <div id="splitInfo" class="split-info">分割位置を選んでね</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
      <button class="btn btn-primary" data-action="execute">分割する</button>
    </div>
  `, true);

  const container = document.getElementById('splitChunks');
  function renderSplitChunks() {
    container.innerHTML = '';
    lines.forEach((line, i) => {
      const lineEl = document.createElement('div');
      const isBlank = line.trim() === '';
      lineEl.className = 'split-line' + (isBlank ? ' blank' : '');
      lineEl.textContent = isBlank ? '(空行)' : line;
      container.appendChild(lineEl);

      // 最後の行の後にはホットスポットなし
      if (i < lines.length - 1) {
        const hot = document.createElement('div');
        const isSplit = splitIndices.includes(i);
        hot.className = 'split-hotspot' + (isSplit ? ' active' : '');
        hot.innerHTML = isSplit
          ? '<div class="split-marker">✂️ ここで分割</div>'
          : '<div class="split-thin"></div>';
        hot.addEventListener('click', () => {
          if (isSplit) splitIndices = splitIndices.filter(x => x !== i);
          else { splitIndices.push(i); splitIndices.sort((a, b) => a - b); }
          renderSplitChunks();
        });
        container.appendChild(hot);
      }
    });

    const info = document.getElementById('splitInfo');
    if (splitIndices.length === 0) {
      info.textContent = '分割位置を選んでね';
      info.classList.remove('has-split');
    } else {
      info.textContent = `${splitIndices.length + 1}個のプロンプトに分かれます`;
      info.classList.add('has-split');
    }
  }
  renderSplitChunks();

  const root = document.getElementById('modalContent');
  root.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="execute"]').addEventListener('click', () => {
    if (splitIndices.length === 0) {
      toast('分割位置を選んでね');
      return;
    }
    const keepOriginal = document.getElementById('keepOriginal').checked;
    performSplit(id, lines, splitIndices, keepOriginal);
  });
}

async function performSplit(id, lines, splitIndices, keepOriginal) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;

  // チャンクに分ける
  const chunks = [];
  let start = 0;
  for (const idx of splitIndices) {
    chunks.push(lines.slice(start, idx + 1).join('\n'));
    start = idx + 1;
  }
  chunks.push(lines.slice(start).join('\n'));

  const now = Date.now();
  const baseTitle = p.title || '(無題)';
  const baseTags = [...(p.tags || [])];
  const baseFolder = p.folder || '';

  // 各チャンクを新規プロンプトとして保存
  chunks.forEach((body, i) => {
    prompts.push({
      id: uid(),
      title: `${baseTitle} (${i + 1})`,
      body: body.replace(/^\n+|\n+$/g, ''), // 前後の改行だけ削る
      tags: [...baseTags],
      folder: baseFolder,
      createdAt: now,
      updatedAt: now,
      history: []
    });
  });

  // 元を消すかどうか
  if (!keepOriginal) {
    prompts = prompts.filter(x => x.id !== id);
  }

  await savePrompts();
  closeModal();
  render();
  toast(`${chunks.length}個に分割しました`);
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function timestamp() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
}

function exportAsJson() {
  const data = {
    version: 1,
    appName: 'ことのはノート',
    exportedAt: new Date().toISOString(),
    prompts: prompts
  };
  downloadFile(JSON.stringify(data, null, 2), `kotonoha_${timestamp()}.json`, 'application/json');
  toast(`${prompts.length}件をJSONで保存`);
}

// ファイル名で使えない文字を安全に
function safeFilename(s, maxLen) {
  return (s || '無題').replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_').replace(/\s+/g, ' ').trim().slice(0, maxLen || 80);
}

// 1プロンプトの内容を整形（Markdown / テキスト 兼用、見た目はほぼ同じ）
function formatPromptForFile(p) {
  const parts = [];
  parts.push(`# ${p.title || '(無題)'}`);
  parts.push('');
  if (p.folder) parts.push(`📁 ${p.folder}`);
  if (p.tags && p.tags.length) parts.push(`🏷 ${p.tags.join(', ')}`);
  if (p.folder || (p.tags && p.tags.length)) parts.push('');
  parts.push(p.body || '');
  return parts.join('\n');
}

async function exportAsIndividual(extension, mimeType) {
  if (prompts.length === 0) {
    toast('保存するプロンプトがないよ');
    return;
  }

  // ファイル作成
  const files = prompts.map(p => {
    const folderPrefix = p.folder ? safeFilename(p.folder.replace(/\//g, '_'), 40) + '_' : '';
    const filename = `${folderPrefix}${safeFilename(p.title, 80)}.${extension}`;
    return new File([formatPromptForFile(p)], filename, { type: mimeType + ';charset=utf-8' });
  });

  // navigator.share で共有シート（モバイルChrome対応）
  if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({
        files,
        title: `ことのはノート ${prompts.length}件`
      });
      toast(`${prompts.length}件を共有しました`);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // ユーザーが共有シートをキャンセル
      // それ以外のエラーはフォールバックへ
    }
  }

  // フォールバック：連続ダウンロード
  if (!confirm(`${prompts.length}個のファイルを連続でダウンロードします。\nブラウザが「複数ファイルのダウンロードを許可しますか？」と聞いてきたら「許可」を選んでね。\n続行する？`)) return;

  for (const file of files) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    await new Promise(r => setTimeout(r, 120));
    URL.revokeObjectURL(url);
  }
  toast(`${prompts.length}件をダウンロードしました`);
}

async function saveOnePromptAsFile(p, extension, mimeType) {
  const folderPrefix = p.folder ? safeFilename(p.folder.replace(/\//g, '_'), 40) + '_' : '';
  const filename = `${folderPrefix}${safeFilename(p.title, 80)}.${extension}`;
  const content = formatPromptForFile(p);

  // navigator.share対応端末ではシェアシートで
  try {
    const file = new File([content], filename, { type: mimeType + ';charset=utf-8' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: p.title || '(無題)' });
      closeModal();
      toast('共有しました');
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') { closeModal(); return; }
  }

  // フォールバック：ふつうにダウンロード
  downloadFile(content, filename, mimeType);
  closeModal();
  toast('保存しました');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.prompts || !Array.isArray(data.prompts)) {
        toast('JSONフォーマットが違うみたい');
        return;
      }
      openImportConfirm(data);
    } catch (e) {
      toast('読み込みエラー: ' + e.message);
    }
  });
  input.click();
}

function openImportConfirm(data) {
  openModal(`
    <div class="modal-header">
      <div class="modal-title">📥 インポート</div>
      <button class="modal-close" data-action="close">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:14px;margin-bottom:8px;line-height:1.6;">
        ${data.prompts.length}件のプロンプトを取り込みます。
      </div>
      ${data.exportedAt ? `<div style="font-size:11px;color:var(--text-sub);margin-bottom:14px;">エクスポート日時: ${new Date(data.exportedAt).toLocaleString('ja-JP')}</div>` : ''}

      <div style="font-size:13px;color:var(--text-sub);margin-bottom:10px;">
        現在: ${prompts.length}件
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="menu-item" data-action="append">
          <div class="menu-item-title">➕ 追加する（推奨）</div>
          <div class="menu-item-desc">現在の ${prompts.length}件 はそのまま、新たに ${data.prompts.length}件 を追加</div>
        </button>
        <button class="menu-item danger" data-action="replace">
          <div class="menu-item-title">🔄 置き換える（危険）</div>
          <div class="menu-item-desc">現在の ${prompts.length}件 を削除して、${data.prompts.length}件 で完全に置き換え</div>
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close">キャンセル</button>
    </div>
  `);

  const root = document.getElementById('modalContent');
  root.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="append"]').addEventListener('click', async () => {
    // 新IDを振って追加
    const newPrompts = data.prompts.map(p => ({ ...p, id: uid() }));
    prompts.push(...newPrompts);
    await savePrompts();
    closeModal();
    render();
    toast(`${newPrompts.length}件を追加しました`);
  });
  root.querySelector('[data-action="replace"]').addEventListener('click', async () => {
    if (!confirm(`現在の${prompts.length}件を全部削除して、${data.prompts.length}件で置き換えます。\n本当にいい？`)) return;
    prompts = data.prompts;
    await savePrompts();
    closeModal();
    render();
    toast(`${data.prompts.length}件で置き換えました`);
  });
}

// ---------- 初期化 ----------
document.getElementById('fab').addEventListener('click', () => {
  if (mergeMode) openMerge();
  else openEdit();
});
document.getElementById('fabDownload').addEventListener('click', openDownloadSelected);
document.getElementById('mergeToggle').addEventListener('click', toggleMergeMode);
document.getElementById('search').addEventListener('input', render);
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

loadPrompts().then(render);
</script>
